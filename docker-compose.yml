services:
  mongodb:
    image: mongo:7
    container_name: worknoon-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: worknoon-backend
    ports:
      - "8001:8001"
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=refund_system
      - CORS_ORIGINS=*
      - EMERGENT_LLM_KEY=${EMERGENT_LLM_KEY}
      - JWT_SECRET=${JWT_SECRET:-please-change-this-secret}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@worknoon.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-worknoon2026}
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the React build; the browser talks to the backend on this URL.
        REACT_APP_BACKEND_URL: http://localhost:8001
    container_name: worknoon-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo_data:
